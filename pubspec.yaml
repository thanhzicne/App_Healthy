name: app_healthcare
description: "A Flutter healthcare tracking application with Firebase integration."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  
  # ✅ THÊM flutter_localizations (BẮT BUỘC)
  flutter_localizations:
    sdk: flutter

  # Intl (DateFormat đang được dùng ở nhiều màn hình)
  intl: ^0.20.2
  
  # State Management
  provider: ^6.1.1
  
  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.2
  firebase_storage: ^12.1.1
  cloud_firestore: ^5.0.2

  # UI & Fonts
  google_fonts: ^6.1.0
  
  # Charts
  fl_chart: ^0.65.0
  
  http: ^1.2.1
  url_launcher: ^6.1.12
  
  # Image Picker (Avatar Upload)
  image_picker: ^1.1.2

  # Google Sign In
  google_sign_in: ^6.2.1

  # Export Data
  pdf: ^3.10.8
  excel: ^4.0.0
  path_provider: ^2.1.2
  share_plus: ^10.1.0

  # Additional utilities
  cupertino_icons: ^1.0.6
  
  # ✅ XÓA dòng intl (flutter_localizations đã bao gồm intl)
  # (Đã thêm intl ở trên để tránh lỗi analyzer depend_on_referenced_packages)

  # Pedometer
  pedometer: ^4.0.1
  permission_handler: ^12.0.1
  sensors_plus: ^6.1.1
  
  # Local Notifications
  flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.3.2
  timezone: ^0.9.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/